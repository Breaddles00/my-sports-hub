# Every push to main builds the Windows app and publishes it as a GitHub Release
# (v1.0.<run number>). Installed copies of My Sports Hub check for this release at
# launch and update themselves automatically.
name: Build & release Windows app

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set version
        id: ver
        run: node scripts/ci-version.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer and portable app
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ls -la release
          gh release create "v${VERSION}" \
            release/My-Sports-Hub-Setup-${VERSION}.exe \
            release/My-Sports-Hub-Setup-${VERSION}.exe.blockmap \
            release/My-Sports-Hub-Portable-${VERSION}.exe \
            release/latest.yml \
            --target "${GITHUB_SHA}" \
            --title "My Sports Hub ${VERSION}" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Installed copies of My Sports Hub update to this version the next time they launch." \
            --latest

      - name: Keep build files
        uses: actions/upload-artifact@v5
        with:
          name: My-Sports-Hub-${{ steps.ver.outputs.version }}
          path: |
            release/*.exe
            release/latest.yml
