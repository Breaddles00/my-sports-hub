# Every push to main builds the Windows app and publishes it as a GitHub Release
# (v1.0.<run number>). Installed copies of My Sports Hub check for this release at
# launch and update themselves automatically.
name: Build & release Windows app

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version
        id: ver
        run: node scripts/ci-version.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and publish release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Keep build files
        uses: actions/upload-artifact@v4
        with:
          name: My-Sports-Hub-${{ steps.ver.outputs.version }}
          path: |
            release/*.exe
            release/latest.yml
