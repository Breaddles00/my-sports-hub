<!doctype html>
<html lang="en" data-platform="web">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' %CONNECT_SRC%; font-src 'self' data:; manifest-src 'self'; worker-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="description" content="Live scores, schedules, standings and stats for NFL, NCAA Football, MLB, NBA, NHL and AFL." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sports Hub" />
    <title>My Sports Hub</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="app.css?v=%BUILD_ID%" />
    <style>
      /* Home-screen app (standalone) on iOS 26+: with viewport-fit=cover and the black-translucent status bar,
         iOS gives the page a viewport one status bar shorter than the screen while the page is no taller than
         that viewport (WebKit bug 301108), and it doesn't paint anything below it. That left an empty band
         under the bottom tab bar (and a taller shell just got clipped). Making the page itself at least
         screen-height gets the full-screen viewport back; min() with 100lvh stops it ever scrolling.
         The shell is then pinned to that viewport. Kept here so it only affects the web build. */
      @media (display-mode: standalone) {
        html[data-platform='web'] {
          min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px)));
          background: var(--bg);
          overscroll-behavior: none;
        }
        html[data-platform='web'] body {
          overflow: visible;
          overscroll-behavior: none;
        }
        html[data-platform='web'] .app {
          position: fixed;
          inset: 0;
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>My Sports Hub needs JavaScript turned on.</noscript>
    <script src="app.js?v=%BUILD_ID%"></script>
  </body>
</html>
