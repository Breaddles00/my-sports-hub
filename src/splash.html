<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'" />
    <title>My Sports Hub</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f17;
        color: #e8edf4;
        font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        box-sizing: border-box;
        border: 1px solid #222d3f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: radial-gradient(500px 220px at 50% 0%, rgba(91, 140, 255, 0.18), transparent 70%);
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 20px;
        font-weight: 650;
        margin: 2px 0 6px;
      }
      #status {
        font-size: 13px;
        color: #c3cddb;
      }
      #sub {
        font-size: 11px;
        color: #7d8aa0;
        min-height: 14px;
        max-width: 360px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar {
        width: 240px;
        height: 4px;
        border-radius: 4px;
        background: #1c2739;
        overflow: hidden;
        position: relative;
      }
      .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: #5b8cff;
        border-radius: 4px;
        transition: width 0.25s;
      }
      .bar.indeterminate .fill {
        width: 35%;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          left: -35%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="icon.png" alt="" />
      <h1>My Sports Hub</h1>
      <div class="bar indeterminate" id="bar"><div class="fill" id="fill"></div></div>
      <div id="status">Checking for updates…</div>
      <div id="sub"></div>
    </div>
    <script src="splash.js"></script>
  </body>
</html>
